name: OrangeFox Build (arctic)

# Cara pakai: tab Actions -> pilih workflow ini -> Run workflow
#  - fox_branch : 14.1 (disarankan, vendor_boot VAB sudah matang)
#                 16.0 = branch terbaru tapi full AOSP manifest (100GB+),
#                 kemungkinan gagal kehabisan disk di runner gratis.
#  - ssh        : 'true' untuk SSH ke runner via tmate (debug)

on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: 'OrangeFox manifest branch'
        required: true
        default: '14.1'
        type: choice
        options:
          - '14.1'
          - '12.1'
          - '16.0'
      build_target:
        description: 'make target (arctic = vendor_boot recovery)'
        required: true
        default: 'vendorbootimage'
        type: choice
        options:
          - vendorbootimage
          - recoveryimage
      ssh:
        description: 'SSH ke runner via tmate (debug)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 12288
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses6 \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush python3 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git lfs install
          git config --global user.email "builder@orangefox.local"
          git config --global user.name "OrangeFox Builder"
          git config --global color.ui false

      - name: Select JDK
        run: |
          case "${{ inputs.fox_branch }}" in
            12.1) CANDIDATES="/usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/java-8-openjdk-amd64" ;;
            14.1) CANDIDATES="/usr/lib/jvm/temurin-17-jdk-amd64 /usr/lib/jvm/java-17-openjdk-amd64" ;;
            16.0) CANDIDATES="/usr/lib/jvm/temurin-21-jdk-amd64 /usr/lib/jvm/java-21-openjdk-amd64" ;;
          esac
          for j in $CANDIDATES; do
            if [ -x "$j/bin/javac" ]; then
              echo "JAVA_HOME=$j" >> $GITHUB_ENV
              echo "Using JDK: $j"
              "$j/bin/java" -version 2>&1
              break
            fi
          done

      - name: Disk warning for 16.0
        if: inputs.fox_branch == '16.0'
        run: |
          echo "::warning::Branch 16.0 = full AOSP manifest (100GB+). Runner gratis kemungkinan kehabisan disk. Kalau gagal, ulangi dengan 14.1."

      - name: Sync OrangeFox sources
        run: |
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox_sync"
          cd "$GITHUB_WORKSPACE/OrangeFox_sync"
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch "${{ inputs.fox_branch }}" --path "$GITHUB_WORKSPACE/fox"

      - name: Place device tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox/device/xiaomi/arctic"
          cp -r "$GITHUB_WORKSPACE/device-tree/"* "$GITHUB_WORKSPACE/fox/device/xiaomi/arctic/"
          ls "$GITHUB_WORKSPACE/fox/device/xiaomi/arctic/"

      - name: SSH via tmate
        if: inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Build
        working-directory: fox
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=arctic
          source build/envsetup.sh
          if [ "${{ inputs.fox_branch }}" = "16.0" ]; then
            lunch twrp_arctic-bp2a-eng || lunch twrp_arctic-eng
          else
            lunch twrp_arctic-eng
          fi
          mka "${{ inputs.build_target }}" -j"$(nproc --all)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-arctic-fox_${{ inputs.fox_branch }}
          if-no-files-found: warn
          path: |
            fox/out/target/product/arctic/vendor_boot.img
            fox/out/target/product/arctic/recovery.img
            fox/out/target/product/arctic/OrangeFox*.zip
